name: Cloudflare Pages preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download static pull request files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p preview
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/zipball/refs/pull/${PR_NUMBER}/merge" \
            --output /tmp/pull-request.zip
          unzip -q /tmp/pull-request.zip -d /tmp/pull-request
          source_dir="$(find /tmp/pull-request -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_dir"
          test -s "$source_dir/docs/index.html"
          cp -R "$source_dir/docs/." preview/

      - name: Deploy Cloudflare Pages preview
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview --project-name=cottage44-menu-pages --branch=pr-${{ github.event.pull_request.number }}

      - name: Add preview link to the pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.cottage44-menu-pages.pages.dev
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = `${marker}
            Cloudflare Pages preview: [Open the deployed site](${process.env.PREVIEW_URL})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
